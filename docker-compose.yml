volumes:
    nfsmount:
        driver: local
        driver_opts:
            type: nfs
            o: addr=host.docker.internal,rw,nolock,hard,nointr,nfsvers=3
            device: ":<path to bargainmax project folder>"
    redis: {}
    rabbitmq_data:
        driver: local
    sock:
    esdata01:
        driver: local
    db-data:
        driver: local
    db-log:
        driver: local
    db-conf:
        driver: local

networks:
    magento2:
        driver: bridge