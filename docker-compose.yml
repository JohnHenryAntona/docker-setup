version: "3.6"
services:

### MAGENTO APP CuctomConcepts ################################################
    web:
        build: ./docker/web
        container_name: ${PROJECT_PREFIX}_docker_web
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - sock:/sock
            - "./src:/var/www/html"
            - "./modules:/var/www/modules"
            - "./docker/web/apache2:/etc/apache2/sites-enabled/"
            - "./docker/web/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini"
            - "./docker/web/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini"
            - "./docker/web/postfix/master.cf:/etc/postfix/master.cf"
            - "./docker/web/postfix/main.cf:/etc/postfix/main.cf"
            - "./docker/web/logs:/var/log"
            - "./docker/web/rc.local:/etc/rc.local"
            - "./docker/web/apache2/bargainmax.local.crt:/etc/apache2/bargainmax.local.crt"
            - "./docker/web/apache2/bargainmax.local.key:/etc/apache2/bargainmax.local.key"
        environment:
            HP_EXTENSION_XDEBUG: ${PHP_EXTENSION_XDEBUG}
            APACHE_EXTENSION_DAV: 1
            APACHE_EXTENSION_SSL: 1
        tty: true
        # links:
        #     - redis # uncomment this if you are going to setup redis caching mechanism
        #     - varnish # uncomment this if you are going to setup varnish caching mechanism
        depends_on:
            - db
            # - redis # uncomment this if you are going to setup redis caching mechanism
            # - varnish # uncomment this if you are going to setup varnish caching mechanism
        networks:
            - magento2

### MySQL ################################################
    db:
        build:
            context: ./docker/mysql
            args:
                - MYSQL_VERSION=${MYSQL_VERSION}
        restart: unless-stopped
        container_name: ${PROJECT_PREFIX}_docker_db
        env_file:
            - ".env"
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
            - UPLOAD_LIMIT=1G
        volumes:
            - ${DATA_PATH_HOST}/mysql:/var/lib/mysql
            - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
            - "db-log:/var/log/mysql"
            - "db-conf:/etc/mysql/conf.d"
        ports:
            - "3306:3306"
        networks:
            - magento2

### phpMyAdmin ###########################################
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: ${PROJECT_PREFIX}_docker_phpmyadmin
        env_file:
            - ".env"
        environment:
            - PMA_ARBITRARY=1
            - MYSQL_USER=root
            - MYSQL_PASSWORD=root ${MYSQL_ROOT_PASSWORD}
            - MYSQL_ROOT_PASSWORD=root ${MYSQL_ROOT_PASSWORD}
            - UPLOAD_LIMIT=1G
        ports:
            - "8083:80"
        depends_on:
            - db
        networks:
            - magento2

