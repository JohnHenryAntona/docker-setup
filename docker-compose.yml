### RabbitMQ ################################################
    rabbitmq:
        image: bitnami/rabbitmq:latest
        container_name: ${PROJECT_PREFIX}_docker_rabbitmq
        labels:
            kompose.service.type: nodeport
        ports:
            - '4369:4369'
            - '5672:5672'
            - '25672:25672'
            - '15672:15672'
        volumes:
            - 'rabbitmq_data:/bitnami'
        environment:
            - RABBITMQ_USERNAME=magento2
            - RABBITMQ_PASSWORD=magento2
            - RABBITMQ_VHOST=magento2
        networks:
            - magento2

### Mailhog ################################################
    mailhog:
        image: mailhog/mailhog:v1.0.0
        container_name: ${PROJECT_PREFIX}_docker_mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - magento2

### Elasticsearch ###########################################
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
        container_name: ${PROJECT_PREFIX}_docker_elasticsearch
        environment:
            - node.name=elasticsearch
            - bootstrap.memory_lock=true
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
            - discovery.type=single-node
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - esdata01:/usr/share/elasticsearch/data
        ports:
            - 9200:9200
        networks:
            - magento2

### Portainer ################################################
    portainer:
        image: portainer/portainer:latest
        container_name: ${PROJECT_PREFIX}_docker_portainer
        volumes:
            - ${DATA_PATH_HOST}/portainer_data:/data
            - /var/run/docker.sock:/var/run/docker.sock
        extra_hosts:
            - "dockerhost:${DOCKER_HOST_IP}"
        ports:
            - 9010:9000
        networks:
            - magento2

