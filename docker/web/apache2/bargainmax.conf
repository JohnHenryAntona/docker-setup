<VirtualHost *:80>
    ServerName bargainmax.local
    ServerAlias bargainmax.local
    DocumentRoot "/var/www/html/bargainmax"
    ErrorLog /var/www/html/apache/error.log
    <Directory "/var/www/html/bargainmax">
        Options +Indexes +Includes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
        Allow from All
    </Directory>
    Protocols h2 http/1.1
</VirtualHost>
